<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>m9edit</title>
<style>
  :root { --bg:#fdfdfc; --ink:#1a1a2e; --dim:#8a8a97; --kw:#0b5ea8;
          --str:#1a7f37; --num:#953800; --com:#6e7781; --err:#cf222e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg);
         color:var(--ink); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:.6em; align-items:center; padding:.45em .8em;
           border-bottom:1px solid #ddd; }
  header b { margin-right:.6em; }
  button { font: inherit; padding:.25em 1em; cursor:pointer; }
  #status { color:var(--dim); font-size:.9em; margin-left:auto; }
  main { flex:1; display:flex; min-height:0; }
  #edcol { flex:3; display:flex; flex-direction:column; min-width:0;
           border-right:1px solid #ddd; }
  #edwrap { flex:1; display:flex; min-height:0; }
  #gutter { margin:0; padding:8px 6px; text-align:right; color:var(--dim);
            background:#f4f4f2; user-select:none; overflow:hidden;
            white-space:pre; font:13px/1.45 ui-monospace, Consolas, monospace; }
  #stack { position:relative; flex:1; overflow:hidden; }
  #hl, #src {
    position:absolute; inset:0; margin:0; padding:8px; border:0;
    font:13px/1.45 ui-monospace, Consolas, monospace;
    white-space:pre; overflow:auto; tab-size:2; }
  #hl { pointer-events:none; }
  #src { background:transparent; color:transparent; caret-color:var(--ink);
         resize:none; outline:none; }
  #side { flex:2; display:flex; flex-direction:column; min-width:0; }
  #diags { max-height:9em; overflow:auto; border-top:1px solid #ddd;
           font:12px/1.5 ui-monospace, monospace; }
  #diags div { padding:.1em .8em; color:var(--err); cursor:pointer; }
  #diags div:hover { background:#fee; }
  #out { flex:1; overflow:auto; padding: .5em .8em;
         font:13px/1.45 ui-monospace, monospace; white-space:pre-wrap; }
  #figs img { max-width:100%; border:1px solid #ddd; margin:.5em 0;
              background:#fff; }
  .kw{color:var(--kw);font-weight:600} .str{color:var(--str)}
  .num{color:var(--num)} .com{color:var(--com);font-style:italic}
  .err{color:var(--err);text-decoration:underline wavy}
  .m9tip { position:fixed; max-width:44em; background:#fffdf5;
         border:1px solid #c9c2a6; box-shadow:0 2px 8px #0002;
         padding:.5em .7em; font:12px/1.5 ui-monospace, monospace;
         white-space:pre-wrap; display:none; z-index:9; }
  .m9tip .sig { color:var(--kw); font-weight:600; }
  .dline{background:#dcebfa;display:inline-block;width:100%}
  .dcell{background:#f7b3b3;border-radius:2px}
</style>
</head>
<body>
<header>
  <b>m9edit</b>
  <button id="run">Run</button>
  <button id="check">Check</button>
  <button id="fmt">Format</button>
  <select id="examples"><option value="">examples…</option></select>
  <span id="status"></span>
</header>
<main>
  <div id="edcol">
    <div id="edwrap">
      <pre id="gutter">1</pre>
      <div id="stack">
        <pre id="hl"><code id="hlc"></code></pre>
        <textarea id="src" spellcheck="false" autocomplete="off"></textarea>
      </div>
    </div>
    <div id="diags"></div>
  </div>
  <div id="side">
    <div id="out">Press Run.  The output of your program appears here;
files it writes appear below it, SVG figures inline.</div>
    <div id="figs"></div>
  </div>
</main>
<script src="/cell.js"></script>
<script src="/hover.js"></script>
<script>
/* The cell -- colour from POST /lex, diagnostics from POST /check,
   the debounces, the gutter -- is cell.js, shared with the tutor's
   pages.  What is this page's own: Run, Format, the examples and
   the hover docstrings. */
'use strict';
var srcEl = document.getElementById('src');
var hl = document.getElementById('hl');
var out = document.getElementById('out');
var figs = document.getElementById('figs');
var status_ = document.getElementById('status');

srcEl.value = "MODULE Hello ;\n\nIMPORT Io ;\n\nBEGIN\n  Io.WriteLine ('hello, world')\nEND Hello.\n";

var cell = M9Cell.attach({
  textarea: srcEl, backdrop: hl, code: document.getElementById('hlc'),
  gutter: document.getElementById('gutter'),
  diags: document.getElementById('diags'), status: status_,
  lex: '/lex', check: '/check'
});
function doCheck() { cell.check(); }
function setBuffer(t) { cell.setBuffer(t); }
document.getElementById('check').onclick = doCheck;
document.getElementById('run').onclick = function() {
  status_.textContent = 'compiling and running...';
  out.textContent = '';
  figs.innerHTML = '';
  fetch('/run', {method:'POST', body: srcEl.value})
    .then(function(r){return r.text();})
    .then(function(t){
      var shown = [], stamp = Date.now();
      for (var line of t.split('\n')) {
        var m = line.match(/^file: (\/out\/[A-Za-z0-9.\-]+)$/);
        if (m) {
          if (/\.(svg|png)$/.test(m[1])) {
            var img = document.createElement('img');
            img.src = m[1];   /* /out sends Cache-Control: no-store, so each run's figure is fresh */
            figs.appendChild(img);
          } else {
            var a = document.createElement('a');
            a.href = m[1]; a.textContent = m[1]; a.target = '_blank';
            figs.appendChild(a);
            figs.appendChild(document.createElement('br'));
          }
        } else {
          shown.push(line);
        }
      }
      out.textContent = shown.join('\n');
      status_.textContent = 'done';
      doCheck();
    })
    .catch(function(){ status_.textContent = 'server unreachable'; });
};

/* the Format button: the canonical layout, comments kept.  An
   unparsable buffer comes back unchanged (the checker says why). */
document.getElementById('fmt').onclick = function() {
  status_.textContent = 'formatting…';
  fetch('/fmt', {method:'POST', body: srcEl.value})
    .then(function(r){return r.text();})
    .then(function(t){ if (t && t !== srcEl.value) setBuffer(t);
                       status_.textContent = 'formatted'; })
    .catch(function(){ status_.textContent = 'server unreachable'; });
};

/* the examples dropdown, seeded from /examples */
var exSel = document.getElementById('examples');
fetch('/examples').then(function(r){return r.json();})
  .then(function(list){
    for (var name of list) {
      var o = document.createElement('option');
      o.value = name;
      o.textContent = name.replace(/^[0-9]+-/, '').replace(/\.m9$/, '');
      exSel.appendChild(o);
    }
  }).catch(function(){});
exSel.onchange = function() {
  var name = exSel.value;
  if (!name) return;
  fetch('/example/' + name).then(function(r){return r.text();})
    .then(function(t){ setBuffer(t); status_.textContent = 'loaded ' + name; })
    .catch(function(){ status_.textContent = 'could not load ' + name; });
  exSel.value = '';
};

/* HOVER DOCSTRINGS: hover.js, shared with the tutorial's pages --
   keyword paragraphs from /kw, module entries from /doc/NAME (the
   m9c --json gather).  This page invents none of it. */
M9Hover.attach({cell: cell});
</script>
</body>
</html>
